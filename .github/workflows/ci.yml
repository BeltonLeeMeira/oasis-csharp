# Integração contínua: a cada push e pull request, o GitHub compila o painel e roda os testes do núcleo.
name: CI

on:
  push:
  pull_request:

jobs:
  painel:
    name: Painel do Posto (build + testes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build Oasis.Posto.sln -c Release
      - run: dotnet run --project Oasis.Posto.Testes -c Release
